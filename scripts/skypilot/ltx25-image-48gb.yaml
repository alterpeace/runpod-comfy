# =============================================================================
# SkyPilot task: LTX-2.5 on RunPod 48GB using the PREBUILT ghcr image
# (ghcr.io/alterpeace/runpod-comfy — ComfyUI + venv + custom nodes baked in).
#
# Volume mounts at /runpod-volume — the image's entrypoint symlinks
# /comfyui/{models,input,output} there at boot (the same layout RunPod
# native pods use). Do NOT mount at /workspace: that shadows the image's
# project dir and the entrypoint dies with
# "exec /workspace/entrypoint.sh failed: No such file or directory".
#
# Model set aligned with examples/ltx25_v2v_retake48_loop_runpod.json
# (dev int8 + gemma int8 + distilled LoRA + IC-LoRA + latent upscaler + VAE)
# plus the distilled int8 transformer and audio VAE for default templates.
#
# Usage:
#   set -a && source .env && set +a
#   sky launch -c ltx25 -y scripts/skypilot/ltx25-image-48gb.yaml \
#       --env HF_TOKEN="$HF_TOKEN"
#
#   ssh -N -L 8188:localhost:8188 ltx25   # WebUI at http://localhost:8188
#   sky down ltx25                        # terminate (volume keeps models)
# =============================================================================

resources:
  cloud: runpod
  # Must match the volume's datacenter (RunPod network volumes are per-DC).
  region: NL
  zone: EU-NL-1
  accelerators: ["L40S:1", "L40:1", "RTX6000-Ada:1", "RTXA6000:1", "A40:1"]
  memory: 32+
  disk_size: 40
  image_id: docker:ghcr.io/alterpeace/runpod-comfy:latest

volumes:
  /runpod-volume:
    name: ltx25-vol

file_mounts:
  /tmp/skypilot-files/h264-allintra.json: config/video_formats/h264-allintra.json

envs:
  HF_TOKEN: "${HF_TOKEN}"
  COMFYUI_ARGS: " "  # empty = no --lowvram (48GB fits int8 models in VRAM)
  # The image's entrypoint defaults to MODE=serverless when it sees
  # RUNPOD_POD_ID — that starts the serverless worker loop. Force pods mode:
  MODE: "pods"

setup: |
  set -e

  echo "=== LTX-2.5 model verification on prebuilt image ==="

  MODELS=/runpod-volume/models
  mkdir -p $MODELS/{checkpoints,text_encoders,vae,loras,latent_upscale_models}
  mkdir -p /runpod-volume/input /runpod-volume/output

  export HF_HUB_ENABLE_HF_TRANSFER=1
  export HF_TOKEN
  HF=/comfyui/venv/bin/hf
  REPO=Lightricks/LTX-2.5

  # hf download with --local-dir nests repo subfolders under the target dir
  # (checkpoints/diffusion_models/...). ComfyUI wants flat category dirs, and
  # the volume already holds flattened files from previous runs — so guard
  # every download on the FLAT path to avoid re-fetching duplicates.
  ensure() {  # ensure <repo> <repo_file> <category_dir>
    local dest="$3/$(basename "$2")"
    if [ -f "$dest" ]; then
      echo "present: $dest"
    else
      $HF download "$1" "$2" --local-dir "$3"
      find "$3" -mindepth 2 -type f -name "*.safetensors" \
        -exec mv -n {} "$3/" \;
    fi
  }

  ensure $REPO text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors \
    $MODELS/text_encoders
  ensure $REPO diffusion_models/ltx-2.5-22b-dev-transformer-comfy-int8-convrot.safetensors \
    $MODELS/checkpoints
  ensure $REPO diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors \
    $MODELS/checkpoints
  ensure $REPO vae/ltx-2.5-video-vae-bf16.safetensors $MODELS/vae
  ensure $REPO vae/ltx-2.5-audio-vae-bf16.safetensors $MODELS/vae
  ensure $REPO loras/ltx-2.5-22b-distilled-lora-450-bf16.safetensors $MODELS/loras
  ensure Lightricks/LTX-2.5-22b-IC-LoRA-Pixel-Spatial-Upscaler \
    ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors $MODELS/loras
  ensure $REPO latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors \
    $MODELS/latent_upscale_models

  # Tokenizer files for the text encoder (nested dir is intentional —
  # CLIPLoader type=ltxv expects the gemma4-12b-ltx-2.5/ subfolder).
  if [ ! -f $MODELS/text_encoders/gemma4-12b-ltx-2.5/tokenizer.json ]; then
    $HF download Lightricks/LTX-2.5-Pre-Trained \
      ltx-2.5-22b-gemma4-12b/config.json \
      ltx-2.5-22b-gemma4-12b/tokenizer_config.json \
      ltx-2.5-22b-gemma4-12b/tokenizer.json \
      ltx-2.5-22b-gemma4-12b/chat_template.jinja \
      ltx-2.5-22b-gemma4-12b/generation_config.json \
      ltx-2.5-22b-gemma4-12b/processor_config.json \
      --local-dir $MODELS/text_encoders/gemma4-12b-ltx-2.5
    ln -sf ../gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors \
      $MODELS/text_encoders/gemma4-12b-ltx-2.5/model.safetensors
  fi

  # h264-allintra video format (all-intra h264 — no motion artifacts)
  VHS_FORMATS=/comfyui/custom_nodes/ComfyUI-VideoHelperSuite/video_formats
  if [ -d "$VHS_FORMATS" ] && [ -f /tmp/skypilot-files/h264-allintra.json ]; then
    cp -f /tmp/skypilot-files/h264-allintra.json "$VHS_FORMATS/"
    echo "Installed h264-allintra video format"
  fi

  echo "=== Setup complete ==="
  du -sh $MODELS/*/

run: |
  # The image's entrypoint (PID 1, MODE=pods) already launched ComfyUI on
  # 8188 with its own env and the /runpod-volume symlinks. Starting a second
  # instance would collide on the port — wait for the existing one instead.
  for i in $(seq 1 120); do
    if curl -s -o /dev/null http://127.0.0.1:8188/; then
      echo "ComfyUI is up (served by the image entrypoint)"
      break
    fi
    sleep 5
  done
  sleep infinity
