name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_tensorrt:
        description: 'Enable TensorRT (adds ~6.2GB)'
        type: boolean
        default: false
      enable_xformers:
        description: 'Enable xformers (may be incompatible with torch 2.10)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMFYUI_VERSION=v0.27.0
            TORCH_VERSION=2.10.0
            TORCH_FLAVOR=cu129
            XFORMERS_VERSION=0.0.34
            ENABLE_XFORMERS=${{ github.event.inputs.enable_xformers || 'false' }}
            ENABLE_SAGEATTENTION=true
            ENABLE_FLASHATTENTION=false
            ENABLE_TENSORRT=${{ github.event.inputs.enable_tensorrt || 'false' }}
            TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0+PTX
            MAX_JOBS=2
