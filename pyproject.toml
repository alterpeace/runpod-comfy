[project]
name = "runpod-serverless"
version = "0.1.0"
description = "RunPod serverless handler for ComfyUI workflows"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "runpod>=1.5.0",
    "pillow>=11.3.0",
    "boto3>=1.40.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]
s3 = [
    "boto3>=1.34.0",
]
proxy = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "aiofiles>=23.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pillow>=11.3.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "aiofiles>=23.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
